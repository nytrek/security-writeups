<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="ui-sans-serif, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .as{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5;rx:12}
      .aslbl{fill:#475569;font-size:13px;font-weight:700}
      .node{fill:#ffffff;stroke:#334155;stroke-width:1.5;rx:8}
      .atk{fill:#fee2e2;stroke:#ef4444}
      .vic{fill:#dbeafe;stroke:#3b82f6}
      .ttl{fill:#0f172a;font-size:12px;font-weight:700}
      .ip{fill:#475569;font-size:11px}
      .link{stroke:#334155;stroke-width:2;fill:none}
      .flow{stroke:#ef4444;stroke-width:2.5;fill:none;stroke-dasharray:6 4}
      .flowlbl{fill:#b91c1c;font-size:11px;font-weight:700}
    </style>
  </defs>

  <!-- AS boxes -->
  <rect class="as" x="20"  y="60" width="300" height="300" rx="12"/>
  <rect class="as" x="360" y="60" width="260" height="300" rx="12"/>
  <rect class="as" x="660" y="60" width="300" height="300" rx="12"/>
  <text class="aslbl" x="40"  y="84">AS 1111  (attacker side)</text>
  <text class="aslbl" x="380" y="84">AS 2222  (transit)</text>
  <text class="aslbl" x="680" y="84">AS 3333  (legit origin)</text>

  <!-- AS1111 nodes -->
  <rect class="node atk" x="45"  y="110" width="120" height="54" rx="8"/>
  <text class="ttl" x="55" y="132">Kali jumpbox</text>
  <text class="ip"  x="55" y="150">192.168.1.100</text>

  <rect class="node atk" x="45"  y="190" width="150" height="54" rx="8"/>
  <text class="ttl" x="55" y="212">FRR router TTM-CORE-01</text>
  <text class="ip"  x="55" y="230">192.168.1.1 · AS 1111</text>

  <rect class="node atk" x="45"  y="272" width="150" height="54" rx="8"/>
  <text class="ttl" x="55" y="294">DNS1 (rogue)</text>
  <text class="ip"  x="55" y="312">10.10.10.10 :53</text>

  <!-- AS2222 nodes -->
  <rect class="node" x="385" y="110" width="110" height="54" rx="8"/>
  <text class="ttl" x="395" y="132">Router TIWS</text>
  <text class="ip"  x="395" y="150">10.1.1.2</text>

  <rect class="node vic" x="385" y="272" width="150" height="54" rx="8"/>
  <text class="ttl" x="395" y="294">VIP victim</text>
  <text class="ip"  x="395" y="312">192.168.2.100</text>

  <!-- AS3333 nodes -->
  <rect class="node" x="690" y="110" width="120" height="54" rx="8"/>
  <text class="ttl" x="700" y="132">Router NICENET</text>
  <text class="ip"  x="700" y="150">AS 3333</text>

  <rect class="node" x="690" y="272" width="150" height="54" rx="8"/>
  <text class="ttl" x="700" y="294">DNS2 (legit)</text>
  <text class="ip"  x="700" y="312">10.10.10.10 :53</text>

  <!-- eBGP links -->
  <line class="link" x1="195" y1="217" x2="385" y2="137"/>
  <line class="link" x1="495" y1="137" x2="690" y2="137"/>

  <!-- original DNS flow victim -> DNS2 -->
  <path class="flow" d="M460,272 C520,220 640,200 765,272" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="540" y="205">① original: victim resolves 10.10.10.10 via DNS2 (AS3333)</text>

  <!-- hijacked flow victim -> DNS1 after /25 + /32 -->
  <path class="flow" d="M460,300 C320,360 230,340 120,326" marker-end="url(#arrow)" stroke="#16a34a"/>
  <text class="flowlbl" x="230" y="380" fill="#15803d">② after /25 hijack + /32 redirect: traffic lands on attacker DNS1</text>
</svg>
